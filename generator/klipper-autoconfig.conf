# Installed by yumi-config install.sh as /etc/systemd/system/klipper.service.d/yumi-autoconfig.conf
# Every start of Klipper (boot, Moonraker update, YUMI_SETUP, Printer Config panel) first runs
# the autoconfig in boot mode: the boards are scanned and printer.cfg is regenerated only when
# they, the preferences or the catalog changed. A failure never prevents Klipper from starting.
# @PROJECT_DIR@ is the yumi-config checkout, rendered by install.sh: a systemd specifier such as
# %h would name the service MANAGER's home (/root for a system unit), not the User= of klipper.
[Service]
ExecStartPre=-/usr/bin/python3 @PROJECT_DIR@/generator/autoconfig.py --boot
