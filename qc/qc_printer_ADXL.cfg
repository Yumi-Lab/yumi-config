#####################################################################
# YUMI QC — dedicated printer.cfg for the ADXL345 bench
# One accelerometer at a time on the pad GPIO header (SPI1, chip select gpio13,
# same wiring as the C235), read by the Linux host MCU (klipper_mcu). No printer
# board: the host MCU is the only MCU, so the bench runs on a bare pad and a new
# ADXL is picked up without restarting Klipper (the chip id is checked at every
# measurement). Verdict: qc/qc_adxl.py.
#####################################################################

[gcode_macro _QC_MODE]
description: QC mode marker
variable_active: 1
variable_model: "ADXL"
gcode:
    RESPOND MSG="QC mode active"

[respond]

# Not used by the bench: KlipperScreen pops "Missing Klipper configuration" without them.
[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[adxl345]
cs_pin: gpio13
spi_bus: spidev1.0
