#####################################################################
# UID STM32 unique (debug_read sur le MCU principal) -> QUERY_MCU_UID
#####################################################################
[mcu_uid]
# mcu: mcu          # MCU interrogé (défaut: mcu principal RJ11)
# addr: 0x1FFF7A10  # base UID STM32F4 (défaut)
# words: 3          # 96 bits = 3 mots de 32 bits

#####################################################################
# MACROS QC (inlinées depuis qc_macros.cfg — cfg monolithique)
#####################################################################

#####################################################################
# YUMI QC — Quality Control Macros (C235 CHROMAX X12)
# Chaque macro signale son statut via RESPOND MSG="QC:{test_id}:{STATUS}"
# STATUS: START, PASS, FAIL, VISUAL (attente confirmation opérateur)
#
# Ordre du protocole usine :
#   0. MCU + firmware (YUMI_CONFIG gravé)  (automatique)
#   1. Ventilateur carte mère        (visuel oui/non)
#   2. Cooling fan (pièce)           (visuel oui/non)
#   3. Ventilateur hotend            (visuel oui/non)
#   4. Chauffe extruder 220°C        (mesure manuelle, reste chaud)
#   5. Chauffe plateau 60°C          (mesure manuelle)
#   6. Cutter TETE CHAUDE            (visuel — coince a froid, comme Bambu)
#   7. Home X                        (automatique, sensorless)
#   8. Home Y                        (automatique, sensorless)
#   9. Z tap home + montée Zmax      (visuel, checkpoint opérateur)
#  10. Z tap calibration course compl.(automatique, spread répétabilité)
#  11. Screws tilt adjust            (automatique, complet)
#  12. Bed mesh                      (automatique, SANS restart)
#  13. Feed E0 -> capteur tete PA8     (automatique)
#  14. Feed E1 -> capteur tete PA8     (automatique)
#
# Conçu pour le printer.cfg dédié qc_printer.cfg (généré depuis le
# backup de prod : capteurs YMS-1/YMS-2 standard avec runout_gcode
# → QC:Ex_ROTATION:FAIL).
#####################################################################

# === 0 : MCU + VARIABLE D'ENVIRONNEMENT FIRMWARE ===
# Vérifie que la carte mère est connectée ET que le firmware a bien été
# gravé par le builder firmware Yumi (constante YUMI_CONFIG dans le MCU).

# configfile.settings donne les noms de MCU en minuscules, mais printer[name]
# ne resout que si la casse correspond -> on skippe les MCU non resolus
# (ex: host SmartPiOne, casse mixte, sans YUMI_CONFIG de toute facon).
[gcode_macro QC_MCU_CHECK]
description: QC - Connexion MCU + identite firmware YUMI_CONFIG (multi-MCU)
gcode:
    RESPOND MSG="QC:MCU_CHECK:START"
    {% set ns = namespace(found=false) %}
    {% for name in printer.configfile.settings %}
      {% if (name == "mcu" or name.startswith("mcu ")) and printer[name] is defined %}
        {% set c = printer[name].mcu_constants %}
        {action_respond_info("[" ~ name ~ "] version: " ~ printer[name].mcu_version)}
        {% if c.YUMI_CONFIG is defined and c.YUMI_CONFIG %}
          {% set ns.found = true %}
          {action_respond_info("[" ~ name ~ "] " ~ c.YUMI_CONFIG)}
          {% if c.YUMI_COMMENT is defined and c.YUMI_COMMENT %}
            {action_respond_info("[" ~ name ~ "] comment: " ~ c.YUMI_COMMENT)}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% if printer["mcu SmartPiOne"] is defined %}
        {action_respond_info("[mcu SmartPiOne] version: " ~ printer["mcu SmartPiOne"].mcu_version ~ " (host SmartPi One)")}
    {% endif %}
    {% if printer['mcu_uid'] is defined %}
        QUERY_MCU_UID
    {% endif %}
    {% if ns.found %}
        RESPOND MSG="QC:MCU_CHECK:PASS"
    {% else %}
        RESPOND TYPE=error MSG="QC: aucune identite YUMI gravee sur les MCU (firmware non grave par le builder firmware Yumi)"
        RESPOND MSG="QC:MCU_CHECK:FAIL"
    {% endif %}

# === 1-4 : VENTILATEURS + CUTTER ===

[gcode_macro QC_FAN_MOTHERBOARD]
description: QC - Ventilateur carte mere (fan_generic pilote a 100%)
gcode:
    RESPOND MSG="QC:FAN_MOTHERBOARD:START"
    SET_FAN_SPEED FAN=Motherboard_Fan SPEED=1.0
    G4 P3000
    RESPOND MSG="QC:FAN_MOTHERBOARD:VISUAL"
    # Reste allume pour refroidir la carte pendant le reste du QC ;
    # QC_CLEANUP le coupe a la fin.

[gcode_macro QC_FAN_PART]
description: QC - Cooling fan (refroidissement piece) a 100%
gcode:
    RESPOND MSG="QC:FAN_PART:START"
    M106 S255
    G4 P2000
    RESPOND MSG="QC:FAN_PART:VISUAL"

[gcode_macro QC_CUTTER]
description: QC - Cutter : insere filament YMS-1 -> tete, extrude, coupe, retracte
gcode:
    RESPOND MSG="QC:CUTTER:START"
    _QC_BOARD_FAN_ON
    SET_FAN_SPEED FAN=hotend_fan SPEED=1.0
    M104 S220                   ; chauffe la buse (deja en chauffe depuis home_x)
    ; Re-home X+Y ENSEMBLE : home_x/home_y séparés laissent un décalage (le
    ; homing_override fake l'autre axe à chaque G28 mono-axe) -> sans ça
    ; CUT_FILAMENT (X-8) part physiquement au-delà et tape la butée min.
    G28 X Y
    M109 S220                   ; ATTEND la tete chaude AVANT le feed (sinon le
                                ; filament froid arrive a la buse et coince)
    ; Va DIRECTEMENT au poop tool (X max, Y milieu) AVANT de charger E0 : on
    ; feed et on extrude au-dessus du poop, plus de traversee du lit ensuite.
    {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
    {% set ymin = printer.configfile.settings.stepper_y.position_min|float %}
    {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
    G90
    G1 X{xmax} Y{(ymin + ymax) / 2.0} F12000
    M400
    T1                          ; active YMS-1 (sync extruder0)
    ; feed YMS-1 jusqu'au capteur tete PA8, puis (mode cutter) extrude 60mm +
    ; refroidit le poop 5s (cooling fan) + CUT_FILAMENT + retracte 120mm
    _QC_HEAD_FEED FEEDER=extruder0 ID=CUTTER SENSOR=YMS-1 MODE=cutter

[gcode_macro QC_FAN_HOTEND]
description: QC - Ventilateur hotend (fan_generic pilote a 100%, sans chauffe)
gcode:
    RESPOND MSG="QC:FAN_HOTEND:START"
    SET_FAN_SPEED FAN=hotend_fan SPEED=1.0
    G4 P2000
    RESPOND MSG="QC:FAN_HOTEND:VISUAL"
    # Reste allume pour le test de chauffe suivant ; QC_CLEANUP le coupe.

# === 5 : CHAUFFE EXTRUDER 220°C (controle manuel au thermometre) ===

[gcode_macro QC_HEAT_EXTRUDER]
description: QC - Chauffe a 220C, AUTO-valide si la temperature est atteinte
gcode:
    RESPOND MSG="QC:HEAT_EXTRUDER:START"
    SET_FAN_SPEED FAN=hotend_fan SPEED=1.0   ; anti heat-creep (fan manuel en mode QC)
    M104 S220
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=215 MAXIMUM=240
    ; temperature atteinte -> validation automatique (reste chaud pour le cutter)
    RESPOND MSG="QC:HEAT_EXTRUDER:PASS"

# === 4b : CHAUFFE PLATEAU (AUTO) ===

[gcode_macro QC_HEAT_BED]
description: QC - Chauffe plateau, AUTO-valide si la temperature est atteinte
gcode:
    RESPOND MSG="QC:HEAT_BED:START"
    {% set bed_temp = params.TEMP|default(60)|int %}
    M140 S{bed_temp}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 3}
    M140 S0   ; temperature atteinte -> coupe la chauffe + validation auto
    RESPOND MSG="QC:HEAT_BED:PASS"

# === 6-8 : HOMING ===
# NB : la verification homed_axes doit se faire dans une 2e macro,
# sinon le template Jinja est evalue AVANT le G28 (etat obsolete).
# IMPORTANT : en mode QC le ventilo carte mere est un fan_generic (non
# auto-gere). _QC_BOARD_FAN_ON le force ON au debut de chaque macro qui
# bouge les moteurs, pour garder la carte refroidie.

[gcode_macro _QC_BOARD_FAN_ON]
description: QC - Force le ventilo carte mere ON (fan manuel en mode QC)
gcode:
    SET_FAN_SPEED FAN=Motherboard_Fan SPEED=1.0

[gcode_macro _QC_VERIFY_HOMED]
description: QC - Verifie homed_axes apres un G28 (evalue a l'execution)
gcode:
    {% set axis = params.AXIS|lower %}
    {% set id = params.ID %}
    {% if axis in printer.toolhead.homed_axes %}
        RESPOND MSG="QC:{id}:PASS"
    {% else %}
        RESPOND MSG="QC:{id}:FAIL"
    {% endif %}

[gcode_macro QC_HOME_X]
description: QC - Home X (sensorless) + lance la chauffe tête/plateau
gcode:
    RESPOND MSG="QC:HOME_X:START"
    _QC_BOARD_FAN_ON
    ; Lance la chauffe tete + plateau (non bloquant) dès le début du protocole :
    ; ça ramp pendant le homing + les contrôles visuels -> tête chaude pour le
    ; cutter, et heat_extruder/heat_bed confirment juste la température atteinte.
    SET_FAN_SPEED FAN=hotend_fan SPEED=1.0
    M104 S220
    M140 S60
    G28 X
    _QC_VERIFY_HOMED AXIS=x ID=HOME_X

[gcode_macro QC_HOME_Y]
description: QC - Home Y (sensorless)
gcode:
    RESPOND MSG="QC:HOME_Y:START"
    _QC_BOARD_FAN_ON
    G28 Y
    _QC_VERIFY_HOMED AXIS=y ID=HOME_Y

[gcode_macro QC_HOME_Z]
description: QC - Home Z (probe), X et Y doivent etre homes avant
gcode:
    RESPOND MSG="QC:HOME_Z:START"
    _QC_BOARD_FAN_ON
    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
        G28 Z
        _QC_VERIFY_HOMED AXIS=z ID=HOME_Z
    {% else %}
        {action_respond_info("QC: X et Y doivent etre homes avant Z")}
        RESPOND MSG="QC:HOME_Z:FAIL"
    {% endif %}

# === 8a : Z TAP HOME + montee Zmax (validation operateur) ===
# Position Z inconnue au depart -> 1 tap pour homer Z (savoir ou est le
# plateau), puis montee tout en haut (course complete) et checkpoint
# operateur que la montee s'est bien passee avant les taps de calibration.

[gcode_macro QC_Z_TAP_HOME]
description: QC - home complet (home Z = 1er tap) + montee Zmax + validation
gcode:
    {% set z_max = printer.configfile.settings.stepper_z.position_max|float %}
    {% set top = z_max - 5 %}
    RESPOND MSG="QC:Z_TAP_HOME:START"
    _QC_BOARD_FAN_ON
    # 1) Buse maintenue a 130C sur TOUTE la phase palpeur (z_tap, screws, mesh) :
    #    trop chaude (220) elle bave -> "No trigger" ; froide (off) le bout de
    #    filament DURCIT en blob et gene le bed mesh. 130 = bout mou, pas de bave.
    #    Coupe a la fin par QC_CLEANUP.
    M104 S130
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=135
    # 2) Home COMPLET reel. On ne se fie JAMAIS a homed_axes : il est fake a
    #    'xyz' par le homing_override ET par le G28 X Y du cutter. Avant, on
    #    testait "z not in homed_axes" -> apres le cutter Z paraissait home ->
    #    on faisait un YUMI_Z_TAP depuis une reference Z bidon -> jamais de
    #    declenchement. G28 = home reel, et le home Z EST le 1er tap (pose Z=0).
    G28
    # 3) Montee tout en haut (course complete) pour la calibration qui suit
    G90
    G1 Z{top} F1800
    M400
    RESPOND MSG="QC:Z_TAP_HOME:VISUAL"

# === 8b : Z TAP CALIBRATION course complete (repetabilite) ===
# Depuis Zmax, refait N taps en remontant tout en haut a chaque fois.
# Calibre le capteur de pression sur la course COMPLETE et mesure la
# repetabilite : chaque YUMI_Z_TAP reporte "VALIDATED: trigger_z=X.XXXX",
# l'engine QC collecte ces valeurs et calcule le spread. Un tap qui n'arrive
# pas a se stabiliser leve une erreur -> macro avorte -> FAIL.

[gcode_macro QC_Z_TAP_CALIB]
description: QC - Repetabilite du tap : repete le YUMI_Z_TAP OFFICIEL jusqu'a converger
# On repete le tap OFFICIEL (petit retract, comme en prod -> ~0.005mm quand la
# buse est propre) AUTANT de fois que possible ; l'engine valide DES QUE 3 taps
# tombent dans la tolerance (0.05) et ecarte les rares outliers (buse sale apres
# cutter). PAS de montee Zmax : c'est justement le plein course qui creait les
# outliers (0.07-1.79mm) et empechait de converger a 0.05.
variable_reps: 15
gcode:
    {% set n = params.N|default(printer["gcode_macro QC_Z_TAP_CALIB"].reps)|int %}
    RESPOND MSG="QC:Z_TAP_CALIB:START"
    _QC_BOARD_FAN_ON
    {% for i in range(n) %}
        RESPOND MSG="QC:ZTAP_ITER:{i + 1}/{n}"
        YUMI_Z_TAP SAVE=0
    {% endfor %}
    # Remonte degager le palpeur (le dernier tap laisse la buse AU LIT -> sinon
    # screws_tilt/bed_mesh demarrent palpeur deja declenche = "triggered prior")
    G90
    G1 Z15 F1800
    M400
    RESPOND MSG="QC:Z_TAP_CALIB:DONE"

# === 9 : SCREWS TILT ADJUST (process complet automatique, A FROID) ===
# Pas de chauffe : le sondage des vis se fait a froid (la chauffe plateau
# est deja validee par le test dedie QC_HEAT_BED).

[gcode_macro QC_SCREWS_TILT]
description: QC - Screws tilt adjust complet (a froid)
gcode:
    RESPOND MSG="QC:SCREWS_TILT:START"
    _QC_BOARD_FAN_ON
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        G1 Z15 F1800
        SCREWS_TILT_CALCULATE
        RESPOND MSG="QC:SCREWS_TILT:PASS"
    {% else %}
        {action_respond_info("QC: machine non homee, screws tilt impossible")}
        RESPOND MSG="QC:SCREWS_TILT:FAIL"
    {% endif %}

# === 10 : BED MESH (complet, A FROID, SANS SAVE_CONFIG donc sans restart) ===

[gcode_macro QC_BED_MESH]
description: QC - Bed mesh complet a froid, sans restart
gcode:
    RESPOND MSG="QC:BED_MESH:START"
    _QC_BOARD_FAN_ON
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        G1 Z15 F1800
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE
        BED_MESH_PROFILE SAVE=default
        RESPOND MSG="QC:BED_MESH:PASS"
    {% else %}
        {action_respond_info("QC: machine non homee, bed mesh impossible")}
        RESPOND MSG="QC:BED_MESH:FAIL"
    {% endif %}

# === 11-12 : FEED E0 / E1 JUSQU'AU CAPTEUR TETE (head_sensor PA8, a froid) ===
# Pousse le filament depuis le YMS jusqu'au switch tete head_sensor (!PA8).
# Valide TOUTE la chaine : moteur feeder + chemin filament jusqu'a la tete +
# capteur tete (filament_detected passe a True). A FROID, par paliers, jusqu'a
# maxd (600mm) max -> sinon FAIL. (PA14 = palpeur Z inductif, sans rapport.)
# Pre-requis operateur : filament dans YMS-1/YMS-2 jusqu'au merger, et PAS
# deja a la tete (sinon FAIL "deja a la tete").

# Semantique systeme (comme la prod) :
#   T0 = pas en impression -> desync tous les feeders (sert de RESET)
#   T1 = active YMS-1 (sync extruder0)  |  T2 = active YMS-2 (sync extruder1)
[gcode_macro T0]
description: QC - Desync tous les feeders (reset / pas en impression)
gcode:
    {% for name in printer %}
      {% if name.startswith("extruder_stepper ") %}
        SYNC_EXTRUDER_MOTION EXTRUDER={name.split(" ")[1]} MOTION_QUEUE=
      {% endif %}
    {% endfor %}

[gcode_macro T1]
description: QC - Active YMS-1 (sync extruder0 sur l'extruder principal)
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder0 MOTION_QUEUE=extruder

[gcode_macro T2]
description: QC - Active YMS-2 (sync extruder1 sur l'extruder principal)
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder0 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

# Macro UNIQUE (TOOL=1 pour YMS-1/E0, TOOL=2 pour YMS-2/E1) -> nom SANS chiffre
# median (Klipper tronque "QC_E0_HEAD" en "QC_E0" inconnu). Valide DEUX choses :
#  - le motion sensor YMS (encodeur, cablage jusqu'a la carte mere) change d'etat
#    quand le filament avance (non-detecte -> detecte)
#  - le capteur tete PA8 detecte l'arrivee du filament
[gcode_macro QC_HEAD_FEED]
description: QC - Feed YMS + valide motion sensor + capteur tete (TOOL=1..12)
gcode:
    {% set tool = params.TOOL|default(1)|int %}
    {% set id = "E" ~ (tool - 1) ~ "_HEAD" %}
    {% set feeder = "extruder" ~ (tool - 1) %}
    {% set sensor = "YMS-" ~ tool %}
    RESPOND MSG="QC:{id}:START"
    # 1) RESET : T0 (desync) + extrude a vide -> l'extruder principal tourne mais
    #    le feeder YMS ne bouge pas -> le motion sensor passe en NON-DETECTE.
    T0
    {% for name in printer %}
      {% if name.startswith("filament_motion_sensor ") %}
        SET_FILAMENT_SENSOR SENSOR={name.split(" ", 1)[1]} ENABLE=0
      {% endif %}
    {% endfor %}
    M83
    G92 E0
    G1 E150 F6000
    M400
    SET_FILAMENT_SENSOR SENSOR={sensor} ENABLE=1
    # 2) Active le bon YMS (T1/T2) + lance le feed (valide motion sensor + tete)
    SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
    _QC_HEAD_FEED FEEDER={feeder} ID={id} SENSOR={sensor} MODE=feed MAXD={params.MAXD|default(900)|int}

[gcode_macro _QC_HEAD_FEED]
description: QC - Setup feed + boucle (valide capteur tete PA8 ET motion sensor YMS)
variable_id: ""
variable_feeder: ""
variable_sensor: ""
variable_pushed: 0
variable_chunk: 25
variable_maxd: 800
variable_yms_seen: 0
variable_mode: "feed"
variable_phase: "feed"
variable_seg: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=id VALUE="'{params.ID}'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=feeder VALUE="'{params.FEEDER}'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=sensor VALUE="'{params.SENSOR}'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=mode VALUE="'{params.MODE|default('feed')}'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=pushed VALUE=0
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=yms_seen VALUE=0
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=phase VALUE="'feed'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=seg VALUE=0
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=maxd VALUE={params.MAXD|default(800)|int}
    _QC_BOARD_FAN_ON
    UPDATE_DELAYED_GCODE ID=_qc_head_step DURATION=0.3

# Boucle unique : lit le capteur tete (PA8) + le motion sensor YMS, puis pousse
# un palier. M83 + sync reaffirmes dans le palier (ne persistent pas en
# delayed_gcode). Palier 25mm @ F600 -> cadence la boucle (pas de spin/hang).
# yms_seen passe a 1 des que le motion sensor detecte du mouvement.
[delayed_gcode _qc_head_step]
gcode:
    {% set v = printer["gcode_macro _QC_HEAD_FEED"] %}
    {% set id = v.id %}
    {% set feeder = v.feeder %}
    {% set sensor = v.sensor %}
    {% set pushed = v.pushed|int %}
    {% set bench = (printer["gcode_macro _QC_MODE"].model|default("")|string).startswith("YMS") %}
    {% set head = printer["filament_switch_sensor head_sensor"].filament_detected %}
    {% set yms = printer["filament_motion_sensor " ~ sensor].filament_detected %}
    {% if yms and v.yms_seen|int == 0 %}
        SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=yms_seen VALUE=1
        {action_respond_info("QC %s: motion sensor %s a change d'etat (mouvement detecte)" % (id, sensor))}
    {% endif %}
    {% if v.phase == "stress" %}
        {% set seg = v.seg|int %}
        {% set speeds = [600, 1800, 3600, 6000, 6000, 3600, 1800, 600] %}
        {% set nseg = speeds|length * 2 %}
        {% if seg > 0 %}
            {action_respond_info("QC %s: stress %d/%d detected=%s" % (id, seg, nseg, yms))}
        {% endif %}
        {% if seg > 0 and (seg % 2) == 1 and not yms %}
            RESPOND TYPE=error MSG="QC {id}: motion sensor {sensor} a PERDU le suivi au segment {seg}/{nseg}"
            M83
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
            G1 E-{[pushed - 150, 0]|max} F1200
            M400
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            RESPOND MSG="QC:{id}:FAIL"
        {% elif seg >= nseg %}
            {action_respond_info("QC %s: stress OK — %d segments ±100mm (10→100→10mm/s), suivi capteur permanent" % (id, nseg))}
            M83
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
            G1 E-{[pushed - 150, 0]|max} F1200
            M400
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            RESPOND MSG="QC:{id}:PASS"
        {% else %}
            {% set spd = speeds[(seg // 2) % speeds|length] %}
            {% set dist = 100 if seg % 2 == 0 else -100 %}
            M83
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
            G1 E{dist} F{spd}
            M400
            SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=seg VALUE={seg + 1}
            UPDATE_DELAYED_GCODE ID=_qc_head_step DURATION=0.3
        {% endif %}
    {% elif head %}
        {% if pushed == 0 and v.mode != "cutter" %}
            RESPOND TYPE=error MSG="QC {id}: filament deja a la tete avant feed (pas retire ?)"
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            RESPOND MSG="QC:{id}:FAIL"
        {% elif v.mode == "cutter" %}
            # Filament arrive a la tete. On est DEJA au poop tool (X max, Y milieu,
            # place AVANT le feed) -> extrude 60mm (purge) -> cooling fan a fond
            # 5s pour solidifier le poop -> CUT_FILAMENT -> retracte 120mm.
            M109 S220
            M83
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
            G1 E60 F300
            M400
            # Refroidit le poop a fond 5s : il solidifie -> ejecte net a la coupe
            M106 S255
            G4 P5000
            CUT_FILAMENT
            G1 E-120 F1200
            M400
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            M106 S0
            M104 S130                  ; reste a 130 pour la phase palpeur (bout
                                       ; de filament mou, pas de blob qui gene)
            {action_respond_info("QC %s: extrude 60 + refroidit poop 5s + coupe + retracte 120" % id)}
            RESPOND MSG="QC:{id}:VISUAL"
        {% elif v.yms_seen|int == 1 %}
            {% if bench %}
                {action_respond_info("QC %s: filament a la tete apres %dmm + motion sensor %s OK -> stress aller-retour" % (id, pushed, sensor))}
                M83
                SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
                G1 E-150 F1200
                M400
                SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=phase VALUE="'stress'"
                SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=seg VALUE=0
                UPDATE_DELAYED_GCODE ID=_qc_head_step DURATION=0.3
            {% else %}
                {action_respond_info("QC %s: filament a la tete apres %dmm + motion sensor %s OK" % (id, pushed, sensor))}
                M83
                G1 E-{pushed if bench else ([pushed, 200]|min)} F1200
                M400
                SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
                RESPOND MSG="QC:{id}:PASS"
            {% endif %}
        {% else %}
            RESPOND TYPE=error MSG="QC {id}: filament a la tete mais motion sensor {sensor} n'a PAS change d'etat (cablage / capteur HS)"
            M83
            G1 E-{pushed if bench else ([pushed, 200]|min)} F1200
            M400
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            RESPOND MSG="QC:{id}:FAIL"
        {% endif %}
    {% elif pushed >= v.maxd|int %}
        RESPOND TYPE=error MSG="QC {id}: filament pas a la tete apres {v.maxd}mm (chemin bouche / moteur / capteur HS)"
        M83
        G1 E-{pushed} F1200
        M400
        SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
        RESPOND MSG="QC:{id}:FAIL"
    {% elif v.yms_seen|int == 1 and not yms %}
        RESPOND TYPE=error MSG="QC {id}: motion sensor {sensor} a CESSE de suivre pendant le feed (a {pushed}mm)"
        M83
        SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
        G1 E-{pushed if bench else ([pushed, 200]|min)} F1200
        M400
        SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
        RESPOND MSG="QC:{id}:FAIL"
    {% else %}
        M83
        SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=extruder
        G1 E{v.chunk|int} F600
        M400
        SET_GCODE_VARIABLE MACRO=_QC_HEAD_FEED VARIABLE=pushed VALUE={pushed + v.chunk|int}
        UPDATE_DELAYED_GCODE ID=_qc_head_step DURATION=0.3
    {% endif %}

# === CLEANUP (fin de QC ou abort) ===

[gcode_macro QC_CLEANUP]
description: QC - Coupe chauffes/fans, capteurs, moteurs, boucle feed
gcode:
    RESPOND MSG="QC:CLEANUP:START"
    UPDATE_DELAYED_GCODE ID=_qc_head_step DURATION=0
    {% for name in printer %}
      {% if name.startswith("filament_motion_sensor ") %}
        SET_FILAMENT_SENSOR SENSOR={name.split(" ", 1)[1]} ENABLE=0
      {% elif name.startswith("extruder_stepper ") %}
        SYNC_EXTRUDER_MOTION EXTRUDER={name.split(" ")[1]} MOTION_QUEUE=
      {% endif %}
    {% endfor %}
    M104 S0
    M140 S0
    M106 S0
    SET_FAN_SPEED FAN=Motherboard_Fan SPEED=0
    SET_FAN_SPEED FAN=hotend_fan SPEED=0
    M84
    RESPOND MSG="QC:CLEANUP:PASS"

# === BOUTON CALIBRATION Z TAP (panel) — juste la séquence, aucun log/contrôle ===
[gcode_macro QC_ZTAP_CALIBRATE]
description: QC - Calibration Z TAP : G28 -> Z max -> tap (séquence seule, pas de log)
gcode:
    _QC_BOARD_FAN_ON
    G28
    G90
    {% set z_max = printer.configfile.settings.stepper_z.position_max|float %}
    G1 Z{z_max - 5} F1800
    M400
    YUMI_Z_TAP

# =====================================================================
# BANC YMS — SWEEP STRESS PARALLÉLISÉE (v2, 22/08) — voir generate_yms12_cfg.py
# =====================================================================

[gcode_macro _QC_YMS_STATE]
description: QC banc - Etat persistant phase1->phase2 (distance poussee + eligibilite stress par position). Remis a zero par CHAQUE position au debut de SA PROPRE phase 1 -> pas de residu inter-run possible pour une position qui tourne vraiment.
variable_pushed_1: 0
variable_ok_1: 0
variable_pushed_2: 0
variable_ok_2: 0
variable_pushed_3: 0
variable_ok_3: 0
variable_pushed_4: 0
variable_ok_4: 0
variable_pushed_5: 0
variable_ok_5: 0
variable_pushed_6: 0
variable_ok_6: 0
variable_pushed_7: 0
variable_ok_7: 0
variable_pushed_8: 0
variable_ok_8: 0
variable_pushed_9: 0
variable_ok_9: 0
variable_pushed_10: 0
variable_ok_10: 0
variable_pushed_11: 0
variable_ok_11: 0
variable_pushed_12: 0
variable_ok_12: 0
gcode:
    # macro porte-etat, jamais appelee directement

[gcode_macro TALL]
description: QC banc — PRATIQUE (test manuel console) : synchronise les 12 extruder_steppers EN MEME TEMPS sur la queue E (preuve directe que SYNC_EXTRUDER_MOTION accepte plusieurs steppers a la fois -- validee le 22/08). Aucun garde-fou ok_n : usage MANUEL uniquement, jamais appelee par le wizard.
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder0 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder4 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder5 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder6 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder7 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder8 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder9 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder10 MOTION_QUEUE=extruder
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder11 MOTION_QUEUE=extruder

[gcode_macro TNONE]
description: QC banc — PRATIQUE (test manuel console) : desynchronise les 12 extruder_steppers (contrepartie de TALL).
gcode:
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder0 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder2 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder3 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder4 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder5 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder6 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder7 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder8 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder9 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder10 MOTION_QUEUE=
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder11 MOTION_QUEUE=

[gcode_macro _QC_REACH_QUEUE]
description: QC banc - file d'attente pour QC_REACH_ALL (test manuel console) : liste des TOOL restants a enchainer automatiquement.
variable_remaining: []
gcode:
    # macro porte-etat, jamais appelee directement

[gcode_macro QC_REACH_ALL]
description: QC banc — PRATIQUE (test manuel console) : enchaine QC_HEAD_FEED_REACH pour TOUS les TOOL= de la liste, un a la fois, en ATTENDANT chaque PASS/FAIL avant de lancer le suivant (evite le tir groupe depuis la console qui ecrase l'etat d'un feed encore en cours -> positions "sautees" avec ok_n resté a 0). TOOLS=1,2,3,...
gcode:
    {% set tools = params.TOOLS.split(",")|map("int")|list %}
    SET_GCODE_VARIABLE MACRO=_QC_REACH_QUEUE VARIABLE=remaining VALUE="{tools[1:]}"
    QC_HEAD_FEED_REACH TOOL={tools[0]} MAXD={params.MAXD|default(900)|int}

[gcode_macro QC_HEAD_FEED_REACH]
description: QC banc — PHASE 1 (sequentiel) : feed YMS jusqu'au capteur tete + valide le motion sensor, retracte 150mm (pret pour le sweep stress groupe). TOOL=1..12.
gcode:
    {% set tool = params.TOOL|int %}
    {% set id = "E" ~ (tool - 1) ~ "_HEAD" %}
    {% set feeder = "extruder" ~ (tool - 1) %}
    {% set sensor = "YMS-" ~ tool %}
    RESPOND MSG="QC:{id}:START"
    SET_GCODE_VARIABLE MACRO=_QC_YMS_STATE VARIABLE=ok_{tool} VALUE=0
    SET_GCODE_VARIABLE MACRO=_QC_YMS_STATE VARIABLE=pushed_{tool} VALUE=0
    _QC_BOARD_FAN_ON
    T0
    {% for name in printer %}
      {% if name.startswith("filament_motion_sensor ") %}
        SET_FILAMENT_SENSOR SENSOR={name.split(" ", 1)[1]} ENABLE=0
      {% endif %}
    {% endfor %}
    M83
    G92 E0
    G1 E150 F6000
    M400
    SET_FILAMENT_SENSOR SENSOR={sensor} ENABLE=1
    _QC_HEAD_REACH_STEP FEEDER={feeder} ID={id} SENSOR={sensor} TOOL={tool} MAXD={params.MAXD|default(900)|int}

[gcode_macro _QC_HEAD_REACH_STEP]
description: QC banc PHASE 1 - Setup boucle feed (clone de _QC_HEAD_FEED, sans la phase stress -> objet variable_* separe pour ne jamais interferer avec le re-test unitaire qui utilise _QC_HEAD_FEED)
variable_id: ""
variable_feeder: ""
variable_sensor: ""
variable_tool: 0
variable_pushed: 0
variable_chunk: 50
variable_maxd: 900
variable_yms_seen: 0
gcode:
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=id VALUE="'{params.ID}'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=feeder VALUE="'{params.FEEDER}'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=sensor VALUE="'{params.SENSOR}'"
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=tool VALUE={params.TOOL|int}
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=pushed VALUE=0
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=yms_seen VALUE=0
    SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=maxd VALUE={params.MAXD|default(900)|int}
    SYNC_EXTRUDER_MOTION EXTRUDER={params.FEEDER} MOTION_QUEUE=extruder
    UPDATE_DELAYED_GCODE ID=_qc_reach_step DURATION=0.3

# Boucle PHASE 1 — feed jusqu'au capteur tete (identique en substance a
# _qc_head_step, sans le branchement stress) : memes 4 issues (deja a la
# tete, capteur muet, decrochage en cours de feed, maxd depasse) + succes
# -> retracte 150mm SEULEMENT (pas tout, le stress groupe part de la),
# persiste pushed/ok dans _QC_YMS_STATE pour la phase 2.
[delayed_gcode _qc_reach_step]
gcode:
    {% set v = printer["gcode_macro _QC_HEAD_REACH_STEP"] %}
    {% set id = v.id %}
    {% set feeder = v.feeder %}
    {% set sensor = v.sensor %}
    {% set tool = v.tool|int %}
    {% set pushed = v.pushed|int %}
    {% set head = printer["filament_switch_sensor head_sensor"].filament_detected %}
    {% set yms = printer["filament_motion_sensor " ~ sensor].filament_detected %}
    {% if yms and v.yms_seen|int == 0 %}
        SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=yms_seen VALUE=1
        {action_respond_info("QC %s: motion sensor %s a change d'etat (mouvement detecte)" % (id, sensor))}
    {% endif %}
    {% if head %}
        {% if pushed == 0 %}
            RESPOND TYPE=error MSG="QC {id}: filament deja a la tete avant feed (pas retire ?)"
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            RESPOND MSG="QC:{id}:FAIL"
            _QC_REACH_QUEUE_NEXT
        {% elif v.yms_seen|int == 1 or yms %}
            {action_respond_info("QC %s: filament a la tete apres %dmm + motion sensor %s OK -> pret pour stress groupe" % (id, pushed, sensor))}
            M83
            G1 E-150 F1200
            M400
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            SET_GCODE_VARIABLE MACRO=_QC_YMS_STATE VARIABLE=pushed_{tool} VALUE={pushed}
            SET_GCODE_VARIABLE MACRO=_QC_YMS_STATE VARIABLE=ok_{tool} VALUE=1
            RESPOND MSG="QC:{id}:PASS"
            _QC_REACH_QUEUE_NEXT
        {% else %}
            RESPOND TYPE=error MSG="QC {id}: filament a la tete mais motion sensor {sensor} n'a PAS change d'etat (cablage / capteur HS)"
            M83
            G1 E-{[pushed, 200]|min} F1200
            M400
            SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
            RESPOND MSG="QC:{id}:FAIL"
            _QC_REACH_QUEUE_NEXT
        {% endif %}
    {% elif pushed >= v.maxd|int %}
        RESPOND TYPE=error MSG="QC {id}: filament pas a la tete apres {v.maxd}mm (chemin bouche / moteur / capteur HS)"
        M83
        G1 E-{pushed} F1200
        M400
        SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
        RESPOND MSG="QC:{id}:FAIL"
        _QC_REACH_QUEUE_NEXT
    {% elif v.yms_seen|int == 1 and not yms %}
        RESPOND TYPE=error MSG="QC {id}: motion sensor {sensor} a CESSE de suivre pendant le feed (a {pushed}mm)"
        M83
        G1 E-{pushed} F1200
        M400
        SYNC_EXTRUDER_MOTION EXTRUDER={feeder} MOTION_QUEUE=
        RESPOND MSG="QC:{id}:FAIL"
        _QC_REACH_QUEUE_NEXT
    {% else %}
        M83
        G1 E{v.chunk|int} F600
        M400
        SET_GCODE_VARIABLE MACRO=_QC_HEAD_REACH_STEP VARIABLE=pushed VALUE={pushed + v.chunk|int}
        UPDATE_DELAYED_GCODE ID=_qc_reach_step DURATION=0.3
    {% endif %}

[gcode_macro _QC_REACH_QUEUE_NEXT]
description: QC banc - Enchaine le TOOL suivant de la file QC_REACH_ALL (no-op si aucune file en cours, càd appel normal via le wizard). Macro dediee (plutot que le Jinja inline) car SET_GCODE_VARIABLE + un appel de macro dans la MEME branche if/elif d'un delayed_gcode a un ordre d'evaluation fragile.
gcode:
    {% set q = printer["gcode_macro _QC_REACH_QUEUE"].remaining %}
    {% if q %}
        SET_GCODE_VARIABLE MACRO=_QC_REACH_QUEUE VARIABLE=remaining VALUE="{q[1:]}"
        QC_HEAD_FEED_REACH TOOL={q[0]}
    {% endif %}

[gcode_macro QC_STRESS_ALL]
description: QC banc — PHASE 2 (parallele) : sweep ±100mm 10→100→10mm/s sur TOUS les TOOL= a la fois (extruder_steppers synchronises ENSEMBLE sur la meme queue E -> un seul G1 E les bouge tous en lockstep), chaque filament_motion_sensor YMS-n lu INDEPENDAMMENT (pin propre par position) -> attribution correcte par YMS meme en mouvement groupe. TOOLS=1,3,4,... (positions ayant deja passe la phase 1, calcule cote panel).
gcode:
    {% set tools = params.TOOLS.split(",")|map("int")|list %}
    {% set st = printer["gcode_macro _QC_YMS_STATE"] %}
    RESPOND MSG="QC:STRESS_ALL:START"
    _QC_BOARD_FAN_ON
    {% for t in tools %}
        {% if st["ok_" ~ t]|int == 1 %}
            SET_FILAMENT_SENSOR SENSOR=YMS-{t} ENABLE=1
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder{t - 1} MOTION_QUEUE=extruder
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_QC_STRESS_ALL_STEP VARIABLE=tools VALUE="{tools}"
    SET_GCODE_VARIABLE MACRO=_QC_STRESS_ALL_STEP VARIABLE=seg VALUE=0
    UPDATE_DELAYED_GCODE ID=_qc_stress_all_step DURATION=0.3

[gcode_macro _QC_STRESS_ALL_STEP]
description: QC banc - Etat de la boucle stress groupee
variable_tools: []
variable_seg: 0
gcode:
    # macro porte-etat, jamais appelee directement

# Boucle PHASE 2 — meme sweep 16 segments que l'ancien mode solo, mais
# appliquee UNE SEULE FOIS a tous les extruder_steppers synchronises
# ensemble : un G1 E{dist} deplace tout le lot en meme temps. Verifie
# CHAQUE motion sensor a CHAQUE segment (pin independante par YMS) -> une
# position qui decroche est marquee FAIL + desynchronisee immediatement
# (elle arrete de bouger avec le groupe) SANS interrompre les autres.
[delayed_gcode _qc_stress_all_step]
gcode:
    {% set v = printer["gcode_macro _QC_STRESS_ALL_STEP"] %}
    {% set st = printer["gcode_macro _QC_YMS_STATE"] %}
    {% set tools = v.tools %}
    {% set seg = v.seg|int %}
    {% set speeds = [600, 1800, 3600, 6000, 6000, 3600, 1800, 600] %}
    {% set nseg = speeds|length * 2 %}
    {% if seg > 0 %}
        {% for t in tools %}
            {% if st["ok_" ~ t]|int == 1 %}
                {% set yms = printer["filament_motion_sensor YMS-" ~ t].filament_detected %}
                {% if (seg % 2) == 1 and not yms %}
                    SET_GCODE_VARIABLE MACRO=_QC_YMS_STATE VARIABLE=ok_{t} VALUE=0
                    RESPOND TYPE=error MSG="QC E{t - 1}_HEAD: motion sensor YMS-{t} a PERDU le suivi au segment {seg}/{nseg}"
                    SYNC_EXTRUDER_MOTION EXTRUDER=extruder{t - 1} MOTION_QUEUE=
                {% else %}
                    {action_respond_info("QC E%d_HEAD: stress %d/%d detected=%s" % (t - 1, seg, nseg, yms))}
                {% endif %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if seg >= nseg %}
        {% for t in tools %}
            {% if st["ok_" ~ t]|int == 1 %}
                {action_respond_info("QC E%d_HEAD: stress OK — %d segments ±100mm (10→100→10mm/s), suivi capteur permanent" % (t - 1, nseg))}
                SYNC_EXTRUDER_MOTION EXTRUDER=extruder{t - 1} MOTION_QUEUE=
            {% endif %}
        {% endfor %}
        {% for t in tools %}
            {% set pushed = st["pushed_" ~ t]|int %}
            {% if pushed > 0 %}
                M83
                SYNC_EXTRUDER_MOTION EXTRUDER=extruder{t - 1} MOTION_QUEUE=extruder
                G1 E-{pushed} F1200
                M400
                SYNC_EXTRUDER_MOTION EXTRUDER=extruder{t - 1} MOTION_QUEUE=
            {% endif %}
        {% endfor %}
        RESPOND MSG="QC:STRESS_ALL:PASS"
    {% else %}
        {% set spd = speeds[(seg // 2) % speeds|length] %}
        {% set dist = 100 if seg % 2 == 0 else -100 %}
        M83
        G1 E{dist} F{spd}
        M400
        SET_GCODE_VARIABLE MACRO=_QC_STRESS_ALL_STEP VARIABLE=seg VALUE={seg + 1}
        UPDATE_DELAYED_GCODE ID=_qc_stress_all_step DURATION=0.3
    {% endif %}
