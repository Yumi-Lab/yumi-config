# m3_plaque_macros.cfg — Impression plaque signaletique NIIMBOT M3 (Yumi Lab).
[gcode_shell_command print_plaque]
command: python3 /home/pi/yumi-m3-plaque/print_plaque.py --density 3 --offx -1 --offy -0.2
timeout: 120.
verbose: True

[gcode_macro QC_PRINT_PLAQUE]
description: Imprime la plaque signaletique de l'imprimante sur la NIIMBOT M3
gcode:
    RESPOND MSG="QC:PLAQUE:START"
    # QUERY_MCU_UID/DEVICE ICI (lignes gcode ordinaires, avant RUN_SHELL_COMMAND) --
    # PAS depuis print_plaque.py lui-meme : une fois RUN_SHELL_COMMAND demarre,
    # Klipper traite deja cette ligne et ne peut plus depiler un nouveau gcode
    # envoye par le script -> DEVICE timeoute TOUJOURS de l'interieur (deadlock),
    # modele/courant retombaient a '?' (constate 29/08). Ici c'est avant, donc pas
    # de deadlock : le script trouve la donnee des sa premiere lecture.
    QUERY_MCU_UID
    DEVICE
    RUN_SHELL_COMMAND CMD=print_plaque
    RESPOND MSG="QC:PLAQUE:DONE"
